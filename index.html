<style>
/* Inside the app: school exercise-book look. Login screen: clean digital look. */
:root{--paper:#f3f6f9;--line:#cfdbe6;--ink:#14213d;--ball:#c8102e;--grass:#2f7d4f;--wood:#d9b77e;--mute:#5d6b7d}
*{box-sizing:border-box;margin:0}
body{font:15px/1.6 'Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);padding-bottom:78px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:9;background:var(--ink);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:10px}
.ball{width:34px;height:34px;border-radius:50%;background:var(--ball);position:relative;flex:none;box-shadow:0 0 0 2px #fff4}
.ball:before{content:"";position:absolute;inset:5px 14px;border-left:2px dotted #fff;border-right:2px dotted #fff}
header h1{font:400 22px 'Galada',cursive;line-height:1.1}header small{display:block;font:11px 'Hind Siliguri';opacity:.7}
#main{max-width:620px;margin:0 auto;padding:6px 0}
.pg{background:#fff;margin:14px 10px;padding:12px 14px 12px 22px;border-radius:4px 12px 12px 4px;border-left:3px solid var(--ball);box-shadow:3px 3px 0 var(--line);position:relative}
.pg:before{content:"";position:absolute;left:-12px;top:14px;bottom:14px;width:5px;background:radial-gradient(circle,var(--ink) 2px,transparent 2.5px) 0 0/5px 22px}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}.hd div{flex:1;min-width:0}.hd small{display:block;color:var(--mute);font-size:12px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--wood);display:inline-grid;place-items:center;font-weight:700;flex:none}
.x{border:0;background:none;color:var(--mute);font-size:16px}
.pi{width:100%;max-height:420px;object-fit:cover;border-radius:6px;margin-top:8px}
.sh{border:1px dashed var(--mute);border-radius:6px;padding:8px;margin-top:8px}
.st{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:8px}
.ac{display:flex;border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}.ac>*{flex:1}
.ac button,.rx>button{width:100%;border:0;background:none;padding:6px;font-weight:600;color:var(--mute)}
.rx{position:relative}.rp{display:none;position:absolute;bottom:38px;left:0;background:#fff;border:2px solid var(--ink);border-radius:30px;padding:4px 8px;gap:8px;font-size:22px;z-index:3}.rx.o .rp{display:flex}.rp i{font-style:normal}
.cl p{background:var(--paper);border-radius:10px;padding:4px 10px;margin:4px 0;font-size:14px}.cl b{font-size:13px}
form.row{display:flex;gap:6px;margin-top:6px}
input,textarea,select{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;white-space:nowrap;cursor:pointer}
.btn.r{background:var(--ball)}.btn.g{background:var(--grass)}.btn.s{padding:4px 10px;font-size:13px}
h2{font:400 24px 'Galada',cursive;margin:12px 14px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;color:#fff9;padding:8px 0 6px;font-size:11px;border-top:3px solid transparent}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:#fff;border-top-color:var(--ball)}
.sum{display:flex;gap:8px;margin:10px}.sum div{flex:1;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px;text-align:center;font-size:13px}.sum b{display:block;font-size:19px}
.in{color:var(--grass)}.out{color:var(--ball)}
.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ch{display:flex;gap:6px;overflow-x:auto;padding:8px 10px}.ch button{flex:none;border:2px solid var(--ink);background:#fff;border-radius:20px;padding:2px 12px}.ch button.on{background:var(--ink);color:#fff}
.ms{padding:6px 12px;display:flex;flex-direction:column;gap:6px;min-height:46vh}
.m{max-width:80%;background:#fff;border:2px solid var(--line);border-radius:12px 12px 12px 2px;padding:4px 10px}.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink);border-radius:12px 12px 2px 12px}.m small{display:block;font-size:11px;opacity:.7}
.bar{position:sticky;bottom:60px;background:var(--paper);padding:8px 10px}
.empty{text-align:center;color:var(--mute);padding:24px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;z-index:20;display:none}
.hide{display:none!important}
/* ---- Digital login ---- */
#auth,#wait{min-height:100vh;display:grid;place-items:center;padding:20px;color:#e8eefc;font-family:'Sora',system-ui,sans-serif;
 background:radial-gradient(600px 400px at 85% -10%,#c8102e55,transparent),radial-gradient(500px 400px at 0% 110%,#1d6fd855,transparent),linear-gradient(#0b1220,#0b1220);position:fixed;inset:0;z-index:30;overflow:auto}
#auth:before,#wait:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/36px 36px;-webkit-mask:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
.card{position:relative;width:100%;max-width:400px;background:#111a2eeb;border:1px solid #2a3a5c;border-radius:20px;padding:26px 22px;backdrop-filter:blur(8px)}
.card .ball{width:46px;height:46px;margin-bottom:14px}.card .ball:before{inset:7px 19px}
.card h1{font:800 30px/1.1 'Sora';letter-spacing:-.5px}
.card .sub{color:#9fb0d4;font-size:13px;margin:6px 0 20px}
.card .sub span{display:block;color:#c9d6f2}
.seg{display:flex;background:#0b1220;border:1px solid #2a3a5c;border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:#9fb0d4;padding:8px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}.seg button.on{background:#e8eefc;color:#0b1220}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer}
.or{display:flex;align-items:center;gap:10px;color:#6f82ab;font-size:12px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:#2a3a5c}
#auth input{background:#0b1220;border:1px solid #2a3a5c;color:#e8eefc;margin-bottom:10px;border-radius:12px;padding:12px}
#auth input:focus{outline:2px solid #1d6fd8;border-color:#1d6fd8}
#auth .btn{width:100%;background:var(--ball);padding:12px;border-radius:12px}
#ae2{color:#ff8a98;font-size:13px;margin-top:10px;min-height:18px}
.lg{width:36px;height:36px;border-radius:10px;flex:none}.lg.big{width:76px;height:76px;border-radius:20px;margin-bottom:14px;display:block}
header #ib{margin-left:auto;background:var(--ball);border-radius:20px}
</style>
</head>
<body>
<!--
FIREBASE SETUP
1) Authentication > Sign-in method: enable Email/Password AND Google. Add your website domain under Authentication > Settings > Authorized domains.
2) Firestore Rules (replace shironamhinantor@gmail.com with the same email as ADMIN_EMAIL below):
rules_version='2';service cloud.firestore{match /databases/{d}/documents{
 function ok(){return request.auth!=null&&get(/databases/$(d)/documents/users/$(request.auth.uid)).data.approved==true}
 function adm(){return ok()&&get(/databases/$(d)/documents/users/$(request.auth.uid)).data.role=='admin'}
 match /users/{u}{allow read:if request.auth!=null;
  allow create:if request.auth.uid==u&&((request.resource.data.approved==false&&request.resource.data.role=='member')||request.auth.token.email=='shironamhinantor@gmail.com');
  allow update:if adm()||(request.auth.uid==u&&request.resource.data.approved==resource.data.approved&&request.resource.data.role==resource.data.role);allow delete:if adm()}
 match /events/{e}{allow read:if ok();allow create,delete:if adm();allow update:if ok()}
 match /ledger/{l}{allow read:if ok();allow write:if adm()}
 match /{p=**}/c/{x}{allow read,write:if ok()}
 match /posts/{p}{allow read,create,update:if ok();allow delete:if ok()&&(resource.data.uid==request.auth.uid||adm())}
 match /rooms/{r}/m/{x}{allow read,write:if ok()}}}
-->

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPZYQJKK0YheaaoAMLQuumFE%2BWnxOz5UXuFqZm9rWm3YKHvNUSSW4NwnHTb3TdKIO%2BQC8YLc7JkoJWB%2BT8OBsQOIpYo=%3C/c2pa:manifest%3E%3C/metadata%3E%3C/svg%3E"><h1>LAV Batch 2012<small>Lakshmipasha Adarsha Bidyalaya</small></h1><button class="btn s hide" id="ib" type="button">Install app</button></header>
 <div id="main"></div>
 <nav id="nav"></nav>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 1) Replace with your Firebase web app config
const CFG={apiKey:"AIzaSyDqepmd4MjXKQRHghR6o7h4k7JUmTbrZ-k",authDomain:"batch-2012-34afd.firebaseapp.com",projectId:"batch-2012-34afd",storageBucket:"batch-2012-34afd.firebasestorage.app",messagingSenderId:"71429753691",appId:"1:71429753691:web:1534d9238ddfb39c77687e"};
// 2) The admin's email (cashier/organizer). This account is approved automatically.
const ADMIN_EMAIL="shironamhinantor@gmail.com";

firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue,ts=()=>FV.serverTimestamp();
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
ago=t=>{if(!t)return'just now';const s=(Date.now()-t.toMillis())/1e3,p=(n,u)=>n+' '+u+(n>1?'s':'')+' ago';return s<60?'just now':s<3600?p(Math.floor(s/60),'minute'):s<86400?p(Math.floor(s/3600),'hour'):p(Math.floor(s/86400),'day')},
av=(u,n)=>u?`<img class=av src="${u}" alt="">`:`<span class=av>${esc((n||'?')[0])}</span>`,
toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
let me=null,tab='feed',unsubs=[],P={},open=new Set(),cu={},room='all',reg=false,regName='';
const RX=['👍','❤️','😂','😮','😢'];
const show=id=>['#auth','#wait','#app'].forEach(s=>$(s).classList.toggle('hide',s!==id));
const clean=()=>{unsubs.forEach(f=>f());unsubs=[];Object.values(cu).forEach(f=>f());cu={}};

// ---------- Auth ----------
function mode(r){reg=r;$('#t1').classList.toggle('on',!r);$('#t2').classList.toggle('on',r);$('#an').classList.toggle('hide',!r);$('#an').required=r;$('#ab').textContent=r?'Create account':'Sign in';$('#ae2').textContent=''}
$('#t1').onclick=()=>mode(false);$('#t2').onclick=()=>mode(true);
const msg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'This email already has an account. Try signing in.','auth/weak-password':'Password must be at least 6 characters.','auth/popup-closed-by-user':'','auth/unauthorized-domain':'This website domain is not authorised in Firebase yet.'}[e.code]??'Something went wrong. Please try again.');
$('#gb').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('#ae2').textContent=msg(e)}};
$('#af').onsubmit=async e=>{e.preventDefault();$('#ae2').textContent='';
 try{if(reg){regName=$('#an').value.trim();await auth.createUserWithEmailAndPassword($('#ae').value,$('#ap').value)}
 else await auth.signInWithEmailAndPassword($('#ae').value,$('#ap').value)}catch(err){$('#ae2').textContent=msg(err)}};
auth.onAuthStateChanged(async u=>{clean();
 if(!u){me=null;return show('#auth')}
 const ref=db.collection('users').doc(u.uid);let d=await ref.get();
 if(!d.exists){const a=u.email===ADMIN_EMAIL;
  await ref.set({name:regName||u.displayName||u.email.split('@')[0],bio:'',phone:'',photo:u.photoURL||'',role:a?'admin':'member',approved:a,createdAt:ts()});d=await ref.get()}
 me={id:u.uid,...d.data()};
 if(!me.approved)return show('#wait');
 show('#app');go(tab)});

// ---------- Navigation ----------
const TABS=[['feed','📝','Feed'],['events','🎉','Events'],['fund','💰','Funds'],['chat','💬','Chat'],['me','🙂','Me']];
function go(t){tab=t;clean();$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==t?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('');({feed,events,fund,chat,me:profile})[t]()}

// ---------- Feed ----------
function feed(){
 $('#main').innerHTML=`<div class=pg><div class=hd>${av(me.photo,me.name)}<b>${esc(me.name)}</b></div>
 <textarea id=pt rows=3 placeholder="What's on your mind? Write a status..."></textarea>
 <div style="display:flex;gap:6px;margin-top:6px"><select id=pm style="width:auto"><option value="">Mood</option><option>😎 Feeling great</option><option>🏏 Playing cricket</option><option>🍛 Picnic mood</option><option>😴 Sleepy</option><option>🥲 Missing school days</option></select>
 <input id=pf type=file accept="image/*" style="border:0;padding:6px 0"><button class="btn r" onclick="newPost()">Post</button></div></div><div id=pl></div>`;
 unsubs.push(db.collection('posts').orderBy('createdAt','desc').limit(50).onSnapshot(s=>{
  const a=document.activeElement;if(a&&a.closest&&a.closest('#pl'))return;
  P={};s.docs.forEach(d=>P[d.id]=d.data());
  $('#pl').innerHTML=s.docs.map(d=>post(d.id,d.data())).join('')||'<div class=empty>No posts yet. Be the first to write one.</div>';
  open.forEach(oc)}))}
function post(id,p){const L=p.likes||{},n=Object.keys(L).length,my=L[me.id];
 return `<article class=pg><div class=hd>${av(p.photo,p.name)}<div><b>${esc(p.name)}</b><small>${ago(p.createdAt)}${p.mood?' | '+esc(p.mood):''}</small></div>${p.uid==me.id||me.role=='admin'?`<button class=x onclick="delP('${id}')">✕</button>`:''}</div>
 ${p.text?`<p>${esc(p.text)}</p>`:''}${p.img?`<img class=pi src="${p.img}" alt="">`:''}
 ${p.shared?`<div class=sh><b>${esc(p.shared.name)}</b><p>${esc(p.shared.text)}</p>${p.shared.img?`<img class=pi src="${p.shared.img}" alt="">`:''}</div>`:''}
 <div class=st><span>${n?Object.values(L).slice(0,3).join('')+' '+n:''}</span><span>${p.cc||0} comments</span></div>
 <div class=ac><div class=rx id="r${id}"><button onclick="lk('${id}')">${my||'👍'} ${my?'':'Like'}</button><div class=rp>${RX.map(r=>`<i onclick="lk('${id}','${r}')">${r}</i>`).join('')}</div></div><button onclick="cm('${id}')">💬 Comment</button><button onclick="sh('${id}')">↪ Share</button></div>
 <div id="c${id}"></div></article>`}
function img(f,max=720){return new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)})}
async function newPost(){const text=$('#pt').value.trim(),im=await img($('#pf').files[0]);if(!text&&!im)return toast('Write something or add a photo');
 await db.collection('posts').add({uid:me.id,name:me.name,photo:me.photo,text,img:im,mood:$('#pm').value,cc:0,likes:{},createdAt:ts()});feed()}
function lk(id,r){const L=(P[id]||{}).likes||{},rx=$('#r'+id);
 if(r){rx.classList.remove('o');return db.doc('posts/'+id).update({['likes.'+me.id]:r})}
 if(L[me.id])return db.doc('posts/'+id).update({['likes.'+me.id]:FV.delete()});rx.classList.toggle('o')}
const delP=id=>confirm('Delete this post?')&&db.doc('posts/'+id).delete();
async function sh(id){const p=P[id];if(!p)return;const t=prompt('Add something to your share (optional)');if(t===null)return;
 await db.collection('posts').add({uid:me.id,name:me.name,photo:me.photo,text:t,img:'',cc:0,likes:{},shared:{name:p.name,text:p.text||'',img:p.img||''},createdAt:ts()});toast('Shared to your feed')}
function cm(id){if(open.has(id)){open.delete(id);cu[id]&&cu[id]();$('#c'+id).innerHTML='';return}open.add(id);oc(id)}
function oc(id){const b=$('#c'+id);if(!b)return;cu[id]&&cu[id]();
 b.innerHTML=`<div class=cl></div><form class=row onsubmit="return sc(event,'${id}')"><input placeholder="Write a comment..." required><button class="btn s">Send</button></form>`;
 cu[id]=db.collection('posts/'+id+'/c').orderBy('createdAt').onSnapshot(s=>{const l=b.querySelector('.cl');if(l)l.innerHTML=s.docs.map(d=>`<p><b>${esc(d.data().name)}</b> ${esc(d.data().text)}</p>`).join('')})}
async function sc(e,id){e.preventDefault();const i=e.target.querySelector('input'),t=i.value.trim();if(!t)return false;i.value='';
 await db.collection('posts/'+id+'/c').add({uid:me.id,name:me.name,text:t,createdAt:ts()});db.doc('posts/'+id).update({cc:FV.increment(1)});return false}

// ---------- Events (cricket, picnic) ----------
function events(){
 $('#main').innerHTML=`<h2>Events &amp; Plans</h2>${me.role=='admin'?`<form class=pg onsubmit="return addE(event)"><input id=et placeholder="Event name (e.g. Annual Cricket 2026)" required style="margin-bottom:6px"><div style="display:flex;gap:6px;margin-bottom:6px"><input id=ed type=date required><input id=ep placeholder="Place" required></div><button class="btn g">Add event</button></form>`:''}<div id=el></div>`;
 unsubs.push(db.collection('events').orderBy('date','desc').onSnapshot(s=>{$('#el').innerHTML=s.docs.map(d=>{const e=d.data(),g=e.going||{},k=Object.keys(g);
  return `<div class=pg><div class=hd><div><b>${esc(e.title)}</b><small>📅 ${esc(e.date)} | 📍 ${esc(e.place)}</small></div>${me.role=='admin'?`<button class=x onclick="db.doc('events/${d.id}').delete()">✕</button>`:''}</div>
  <p>${k.length?'Going ('+k.length+'): '+k.map(i=>esc(g[i])).join(', '):'No one has confirmed yet'}</p>
  <button class="btn ${g[me.id]?'':'g'} s" style="margin-top:6px" onclick="rsvp('${d.id}',${!!g[me.id]})">${g[me.id]?"I can't go":"I'm going ✅"}</button></div>`}).join('')||'<div class=empty>No events yet. The admin can add one.</div>'}))}
async function addE(e){e.preventDefault();await db.collection('events').add({title:$('#et').value,date:$('#ed').value,place:$('#ep').value,going:{}});e.target.reset();return false}
const rsvp=(id,on)=>db.doc('events/'+id).update({['going.'+me.id]:on?FV.delete():me.name});

// ---------- Funds ----------
function fund(){
 $('#main').innerHTML=`<h2>Funds &amp; Accounts</h2><div class=sum id=sm></div>${me.role=='admin'?`<form class=pg onsubmit="return addL(event)"><div style="display:flex;gap:6px;margin-bottom:6px"><select id=lt style="width:auto"><option value=in>Income (donation)</option><option value=out>Expense</option></select><input id=la type=number min=1 placeholder="Amount" required></div><input id=ln placeholder="From whom / what for" required style="margin-bottom:6px"><button class="btn g">Add entry</button></form>`:''}<div class=pg id=ll></div>`;
 unsubs.push(db.collection('ledger').orderBy('createdAt','desc').onSnapshot(s=>{let i=0,o=0;
  $('#ll').innerHTML=s.docs.map(d=>{const l=d.data();l.type=='in'?i+=l.amount:o+=l.amount;return `<div class=li><span>${esc(l.note)}<br><small style="color:var(--mute)">${ago(l.createdAt)}</small></span><b class="${l.type}">${l.type=='in'?'+':'-'}৳${l.amount} ${me.role=='admin'?`<button class=x onclick="db.doc('ledger/${d.id}').delete()">✕</button>`:''}</b></div>`}).join('')||'<div class=empty>No entries yet.</div>';
  $('#sm').innerHTML=`<div>Total in<b class=in>৳${i}</b></div><div>Total out<b class=out>৳${o}</b></div><div>Balance<b>৳${i-o}</b></div>`}))}
async function addL(e){e.preventDefault();await db.collection('ledger').add({type:$('#lt').value,amount:+$('#la').value,note:$('#ln').value,createdAt:ts()});e.target.reset();return false}

// ---------- Chat ----------
async function chat(){
 const us=(await db.collection('users').where('approved','==',true).get()).docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!=me.id);
 const rid=u=>[me.id,u].sort().join('_');
 $('#main').innerHTML=`<div class=ch><button class="${room=='all'?'on':''}" onclick="room='all';chat()">👥 Everyone</button>${us.map(u=>`<button class="${room==rid(u.id)?'on':''}" onclick="room='${rid(u.id)}';chat()">${esc(u.name)}</button>`).join('')}</div><div class=ms id=ms></div>
 <form class="bar row" onsubmit="return sm(event)"><input id=mi placeholder="Type a message..." required autocomplete=off><button class=btn>Send</button></form>`;
 unsubs.push(db.collection('rooms/'+room+'/m').orderBy('createdAt').limitToLast(80).onSnapshot(s=>{const b=$('#ms');if(!b)return;
  b.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="m ${m.uid==me.id?'me':''}">${m.uid!=me.id?`<small>${esc(m.name)}</small>`:''}${esc(m.text)}</div>`}).join('')||'<div class=empty>No messages yet. Say hello.</div>';b.lastElementChild&&b.lastElementChild.scrollIntoView()}))}
async function sm(e){e.preventDefault();const i=$('#mi'),t=i.value.trim();if(!t)return false;i.value='';await db.collection('rooms/'+room+'/m').add({uid:me.id,name:me.name,text:t,createdAt:ts()});return false}

// ---------- Profile ----------
function profile(){
 $('#main').innerHTML=`<h2>My page</h2><div class=pg><div class=hd>${av(me.photo,me.name)}<div><b>${esc(me.name)}</b><small>${me.role=='admin'?'Admin':'Batchmate'}</small></div></div>
 <input id=pn value="${esc(me.name)}" placeholder="Name" style="margin-bottom:6px"><input id=pph value="${esc(me.phone)}" placeholder="Phone number" style="margin-bottom:6px"><textarea id=pb rows=2 placeholder="About me" style="margin-bottom:6px">${esc(me.bio)}</textarea>
 <input id=pp type=file accept="image/*" style="border:0;padding:4px 0;margin-bottom:6px"><button class="btn g" onclick="saveP()">Save</button> <button class="btn" onclick="auth.signOut()">Sign out</button></div>
 ${me.role=='admin'?'<h2>Waiting for approval</h2><div class=pg id=pe></div>':''}<h2>All batchmates</h2><div class=pg id=mb></div>`;
 unsubs.push(db.collection('users').onSnapshot(s=>{const U=s.docs.map(d=>({id:d.id,...d.data()}));
  $('#mb').innerHTML=U.filter(u=>u.approved).map(u=>`<div class=hd>${av(u.photo,u.name)}<div><b>${esc(u.name)}</b><small>${esc(u.bio)} ${u.phone?'| '+esc(u.phone):''}</small></div></div>`).join('');
  const pe=$('#pe');if(pe)pe.innerHTML=U.filter(u=>!u.approved).map(u=>`<div class=li><b>${esc(u.name)}</b><span><button class="btn g s" onclick="db.doc('users/${u.id}').update({approved:true})">Approve</button> <button class="btn r s" onclick="db.doc('users/${u.id}').delete()">Reject</button></span></div>`).join('')||'<div class=empty>No one is waiting.</div>'}))}
async function saveP(){const f=$('#pp').files[0],u={name:$('#pn').value.trim()||me.name,phone:$('#pph').value,bio:$('#pb').value};if(f)u.photo=await img(f,200);
 await db.doc('users/'+me.id).update(u);Object.assign(me,u);toast('Saved');profile()}

// ---------- Install app (Android/Chrome button + iPhone hint) ----------
let dp=null;const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent),SA=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ib').classList.remove('hide')});
$('#ib').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#ib').classList.add('hide')}else alert('On iPhone: tap the Share button in Safari, then "Add to Home Screen".')};
if(IOS&&!SA)$('#ib').classList.remove('hide');
addEventListener('appinstalled',()=>$('#ib').classList.add('hide'));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
